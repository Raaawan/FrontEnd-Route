<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>personal Data</title>
</head>
<body>
    <form action="">
        <fieldset style="background-color: rgb(208, 9, 9);">
        <legend style="background-color: blue;">Personal Data</legend>
    <div>
        <br>
        <fieldset style="background-color: rgb(159, 159, 5);">
            <legend style="background-color: rgb(165, 165, 234); padding-block: 30px;">
                YourName
            </legend>
            <table>
                <tr>
                    <td>
                        <label for="firstName">First name </label>
                    </td>
                    <td>:</td>
                    <td>
                        <input type="text" name="firstName" id="firstName">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="lastName">second name </label>
                    </td>
                    <td>:</td>
                    <td>
                        <input type="text" name="lastName" id="lastName">
                    </td>
                </tr>
            </table>
        </fieldset>

    </div>
    <br>
    <br>
    <table>
        <tr>
            <td>
                <label for="phone">your phone </label>
            </td>
            <td>:</td>
            <td>
                <input type="tel" name="phone" id="phone">
            </td>
        </tr>
        <tr>
            <td>
                <label for="email">Email</label>
            </td>
            <td>:</td>
            <td>
                <input type="email" name="email" id="email">
            </td>
        </tr>
        <tr>
            <td>
                <label for="password">password </label>
            </td>
            <td>:</td>
            <td>
                <input type="password" name="password" id="password">
            </td>
        </tr>
        <tr>
            <td>
                <label for="repassword">re-password</label>
            </td>
            <td>:</td>
            <td>
                <input type="password" name="repassword" id="repassword">
            </td>
        </tr>
    </table>
    <input type="radio" name="gender" id="gender" value="male"> male
    <br>
    <input type="radio" name="gender" id="gender" value="female"> female
    <br>
    <br>
    <input type="checkbox" name="position" id="position" value="student"> student
    <br>
    <input type="checkbox" name="position" id="position" value="Graduated"> Graduated
    <br>
    <br>
    <select name="selectoptions" id="selectoptions">
        <optgroup label="Group 1">
            <option value="Option 1.1">Option 1.1</option>
        </optgroup>
        <optgroup label="Group 2">
            <option value="Option 2.1">Option 2.1</option>
            <option value="Option 2.2">Option 2.2</option>
        </optgroup>
        <optgroup label="Group 3" disabled>
            <option value="Option 3.1">Option 3.1</option>
            <option value="Option 3.2">Option 3.2</option>
            <option value="Option 3.3">Option 3.3</option>
        </optgroup>
    </select>
    <br>
    <button style="text-transform: capitalize; background-color: black; color: white;">Submit</button>
    </fieldset>

    </form>
</body>
</html>
